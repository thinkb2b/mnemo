<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mnemo Intelligent Snippets</title>
    
    <!-- Office.js -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    
    <!-- Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel for in-browser compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Import Map: CLEANED - Only React 18. No more React 19 conflicts. -->
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "@google/genai": "https://esm.sh/@google/genai@0.1.1",
    "lucide-react": "https://esm.sh/lucide-react@0.292.0?external=react",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>

    <!-- Global Config -->
    <script>
      // API Key Handling
      const MY_API_KEY = "AIzaSyB6sl23WJaAOt789_12b5VTe-LdDzLP5BA"; 

      window.process = {
        env: { API_KEY: MY_API_KEY }
      };

      // Error Reporting
      window.onerror = function(message, source, lineno, colno, error) {
        console.error("Critical Start Error:", message, error);
        const root = document.getElementById('root');
        if (root) {
            root.innerHTML = `
                <div style="color: #ef4444; padding: 30px; font-family: sans-serif; text-align: center; background: white; height: 100vh;">
                    <h2 style="margin-bottom: 10px;">Mnemo konnte nicht starten</h2>
                    <p style="color: #64748b; font-size: 14px;">Fehler: ${message}</p>
                    <p style="color: #94a3b8; font-size: 12px; margin-top: 5px;">${source}:${lineno}</p>
                    <button onclick="window.location.reload()" style="margin-top: 20px; padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Seite neu laden</button>
                </div>
            `;
        }
      };
    </script>

    <style>
      body {
        background-color: #f8fafc;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      .loader {
        border: 3px solid #e2e8f0;
        border-top: 3px solid #3b82f6;
        border-radius: 50%;
        width: 32px;
        height: 32px;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      #loading-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div id="root">
        <div id="loading-screen">
            <div class="loader"></div>
            <p style="margin-top: 1rem; font-size: 14px; font-weight: 500;">Mnemo wird geladen...</p>
        </div>
    </div>
    
    <!-- Main Script -->
    <script type="text/babel" data-presets="typescript,react" data-type="module" src="./index.tsx"></script>
  </body>
</html>
