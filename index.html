<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mnemo Intelligent Snippets</title>
    
    <!-- Office.js -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    
    <!-- Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel for in-browser compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Import Map: FIXED - Removed React 19 conflicts -->
    <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@0.1.1",
    "lucide-react": "https://esm.sh/lucide-react@0.292.0?external=react",
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>

    <!-- API Key Config & Error Handler -->
    <script>
      const MY_API_KEY = "HIER_IHREN_GOOGLE_GEMINI_API_KEY_EINFÜGEN";

      window.process = {
        env: { API_KEY: MY_API_KEY }
      };

      // Global Error Handler
      window.onerror = function(message, source, lineno, colno, error) {
        console.error("Global Error:", message, error);
        const loader = document.getElementById('loading-screen');
        if (loader) {
            loader.innerHTML = `
                <div style="color: #ef4444; text-align: center; padding: 20px; font-family: sans-serif;">
                    <h3 style="margin-top:0">Fehler beim Starten</h3>
                    <p>${message}</p>
                    <small style="color: #666;">${source}:${lineno}</small>
                </div>
            `;
        }
      };
    </script>

    <style>
      body {
        background-color: #f3f4f6;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
      }
      .loader {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3b82f6;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      #loading-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div id="root">
        <div id="loading-screen">
            <div class="loader"></div>
            <p style="margin-top: 1rem;">Mnemo wird geladen...</p>
        </div>
    </div>
    
    <!-- Load the main app logic -->
    <script type="text/babel" data-presets="typescript,react" data-type="module" src="./index.tsx"></script>
  </body>
</html>
